name: One-time dashboard domain setup

# Temporary: runs the vm.descanto.com wiring script using this repo's
# CLOUDFLARE_API_TOKEN. Delete this workflow + scripts/ copy after success.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-dashboard-domain.yml

permissions:
  contents: read

jobs:
  ensure-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./scripts/ensure-dashboard-domain.sh
