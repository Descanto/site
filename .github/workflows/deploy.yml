name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-www:
    runs-on: ubuntu-latest
    name: Build and deploy site
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Pushes to main deploy to production; PRs get a preview URL on the same project.
      # The action's `command:` input is not shell-expanded, so deploy directly
      # with wrangler here. Branch name goes through an env var and is sanitized —
      # head_ref is attacker-controlled on PRs.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 010c4c6b0df9ff6b8de54f1788a3905b
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            branch=main
          else
            branch=$(printf '%s' "$HEAD_REF" | tr -c 'a-zA-Z0-9-' '-')
          fi
          bunx wrangler pages deploy dist --project-name descanto-www --branch "$branch"

  deploy-docs:
    runs-on: ubuntu-latest
    name: Build and deploy docs
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 010c4c6b0df9ff6b8de54f1788a3905b
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            branch=main
          else
            branch=$(printf '%s' "$HEAD_REF" | tr -c 'a-zA-Z0-9-' '-')
          fi
          bunx wrangler pages deploy out --project-name descanto-docs --branch "$branch"
