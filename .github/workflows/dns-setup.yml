name: dns-setup
on: workflow_dispatch
jobs:
  cname:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages custom-domain CNAMEs
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE=ad21d709525b0360d2842d6708c23703
          for pair in "canto:canto-dashboard.pages.dev" "docs:descanto-docs.pages.dev"; do
            name="${pair%%:*}"; target="${pair##*:}"
            resp=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$target\",\"proxied\":true}")
            echo "$name -> $target: $(echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("OK" if d["success"] else d["errors"])')"
          done
